name: Repository verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install verification and declared Python dependencies
        run: |
          python -m pip install 'pytest>=8,<10' 'pypdf>=6,<7'
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Verify actual visibility, files, documents and configured tests
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
        run: python tools/verify_repository.py --visibility "$REPOSITORY_VISIBILITY"
